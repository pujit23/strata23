global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "strata-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["strata-service:8080"]

  - job_name: "strata-engine"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["strata-engine:50051"]
