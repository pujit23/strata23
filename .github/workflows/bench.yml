name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      dataset_size:
        description: 'Dataset vector count (e.g. 10000, 100000)'
        required: true
        default: '10000'
  schedule:
    - cron: '0 2 * * 0' # Weekly Sunday at 2 AM UTC

jobs:
  performance-benchmark:
    name: Run Benchmark Matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Benchmark Dependencies
        run: pip install numpy httpx
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Run JMH Core Distance Kernels
        run: ./gradlew :strata-core:jmh --no-daemon
      - name: Run Filter Selectivity Regression Check
        run: bash benchmarks/regression.sh
