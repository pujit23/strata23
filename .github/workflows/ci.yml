name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  proto-check:
    name: Protobuf Lint & Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: Run buf lint
        run: buf lint

  java-engine:
    name: Java Vector Engine (JDK 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Build and Test Java Modules
        run: ./gradlew test check --no-daemon

  service-gateway:
    name: Node.js Service Layer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: service/package-lock.json
      - name: Install dependencies
        working-directory: service
        run: npm ci
      - name: Typecheck
        working-directory: service
        run: npm run typecheck
      - name: Run Vitest Unit Tests
        working-directory: service
        run: npm run test:unit

  console-ui:
    name: React 19 Console UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: console/package-lock.json
      - name: Install dependencies
        working-directory: console
        run: npm ci
      - name: Typecheck
        working-directory: console
        run: npm run typecheck
      - name: Run Component Tests
        working-directory: console
        run: npm run test
      - name: Build Console Bundle
        working-directory: console
        run: npm run build
