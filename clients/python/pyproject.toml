[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strata-client"
version = "3.0.0"
description = "Official Python client for STRATA Vector Database"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "grpcio>=1.68.0",
    "protobuf>=5.29.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.10.0",
]
